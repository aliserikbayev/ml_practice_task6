services:
  mlflow:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - mlflow_data:/mlflow
    command: >
      sh -c "pip install --no-cache-dir 'mlflow>=2.12,<4' &&
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000"
    ports:
      - "5000:5000"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  mlflow_data:
